name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run release checks without publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm package
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1 (v1.15.0)
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile

      - run: vp check

      - name: Check documentation
        run: vp run --filter @taipa/docs check

      - run: vp run -r build

      - name: Provision Playwright Chromium and Linux system dependencies
        working-directory: packages/ui
        run: vp exec playwright install --with-deps chromium

      - run: vp run -r test

      - name: Toolchain deliberate-failure smoke checks
        run: node scripts/smoke-toolchain.mjs

      - run: node scripts/verify-package.mjs

      - run: node scripts/verify-consumer.mjs

      - name: Verify release preflight
        run: node scripts/verify-release.mjs

      - name: Determine npm dist-tag
        id: npm-tag
        run: |
          VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("packages/ui/package.json", "utf8")).version')
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run npm publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        working-directory: packages/ui
        run: npm publish --dry-run --access public --tag ${{ steps.npm-tag.outputs.tag }}

      - name: Publish to npm with provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/ui
        run: npm publish --provenance --access public --tag ${{ steps.npm-tag.outputs.tag }}

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Published @taipa/ui@$VERSION."
