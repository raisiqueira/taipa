packages:
  - benchmarks
  - playground
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": 24.13.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vite-plus: 0.2.5
  # alien-signals is the shared reactivity contract across every Taipa package
  # and the CDN import map. Keep this exact (KTD4/KTD8); bump deliberately.
  alien-signals: 3.2.1
  # Bundled Vitest version in vite-plus@0.2.5; the browser provider peer must match exactly.
  "@vitest/browser-playwright": 4.1.10
  playwright: 1.61.1
  vite-cli: npm:vite@^8.1.5
  lit-html: ^3.3.3
  react: ^19.2.8
  react-dom: ^19.2.8
  vue: ^3.5.40
  ilha: ^0.9.5
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-vue": ^6.0.8
  # CodSpeed benchmark harness for @taipa/ui. tinybench stays on v5: the
  # CodSpeed plugin does not support tinybench v6 yet.
  tinybench: 5.1.0
  "@codspeed/tinybench-plugin": ^5.7.1
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
